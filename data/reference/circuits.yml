# Hand-maintained circuit taxonomy. Geometry is the published layout as of the 2025 calendar.
# Where a circuit was reprofiled inside the 2021-2025 window, `reprofiled` names the first
# season of the current layout, so history from before it can be down-weighted.
#
# `demand` is an ordinal 1-5 band, not a measurement: 1 is the lowest demand on the calendar
# and 5 the highest. The bands follow the published Brembo braking index and Pirelli's
# per-round tyre stress notes. Nothing here is derived from our own data. Pit-lane loss,
# safety-car rate and overtaking difficulty are deliberately absent: those come from our
# own history and are regenerated by script, never typed by hand.

