# The final issue of each season's regulations, which is the one that governed the races in the
# lake. Every intermediate issue is listed at fia.com/regulation/category/110 and is near-identical
# text: indexing all ninety of them would answer one question with thirteen copies of the article.
# The issue date is in the metadata, so an earlier issue can be added later without moving anything.
#
# The Sporting Code is the book the stewards cite most after the Sporting Regulations, and it is
# published only as a single French-English document, so half of what lands is the French column.
# Its appendices are separate documents, and Appendix L, the drivers' code, carries 251 of the 709
# citations that name the Code. Appendix H is another 57 and is not here yet.

