[project]
name = "pitadvisor"
version = "0.1.0"
description = "F1 race-weekend advisor: lakehouse, forecast and grounded agent on AWS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3[crt]>=1.35",
    "duckdb>=1.1",
    "polars>=1.8",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
# only the fargate session ingest needs this, it drags in pandas and matplotlib
sessions = ["fastf1>=3.4"]

[project.scripts]
pitadv = "pitadvisor.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitadvisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
exclude = [".venv", "infra", "cdk.out", "web", "tests"]
