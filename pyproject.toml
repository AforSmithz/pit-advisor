[project]
name = "pitadvisor"
version = "0.1.0"
description = "F1 race-weekend advisor: lakehouse, forecast and grounded agent on AWS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools>=3.34.0",
    "boto3[crt]>=1.35",
    "duckdb>=1.1",
    "numpy>=2.1",
    "polars>=1.8",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0.3",
    "scipy>=1.14",
    "sqlglot>=30.17.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# only the fargate session ingest needs this, it drags in pandas and matplotlib
sessions = ["fastf1>=3.4"]
# the runtime interface client, so the one image can also be a lambda
lambda = ["awslambdaric>=3.0"]

[project.scripts]
pitadv = "pitadvisor.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "matplotlib>=3.9",
    "pre-commit>=3.8",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# dbt itself plus both adapters: duckdb runs the models locally, athena runs them in the lake
transform = [
    "dbt-athena-community>=1.9",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitadvisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the test tree mirrors the source tree, so two test_weather.py exist and rootdir-relative
# module names are the only thing that keeps them apart
addopts = "-q --strict-markers --import-mode=importlib"

[tool.uv]
default-groups = ["dev", "transform"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
exclude = [".venv", "infra", "cdk.out", "web", "tests"]
