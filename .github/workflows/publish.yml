name: publish

on:
  push:
    branches: [main]
  # also what the pipeline's last step calls once new views are in the lake
  workflow_dispatch:

# no static credentials anywhere: the role is assumed with a token github mints per run
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  dashboard:
    # inert until the publish role is deployed and its arn set as a repository variable
    if: vars.AWS_PUBLISH_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ap-southeast-1
    # pinned to commits: the same github identity can assume the image role too
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      # the dashboard is not at the repo root, so the action has nowhere to read the
      # version from unless it is pointed at web/package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # the views are whatever the weekend pipeline last emitted. CI never fits anything
      - run: just web-data
      - run: just web-deploy
