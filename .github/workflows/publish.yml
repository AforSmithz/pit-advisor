name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# no static credentials anywhere: the role is assumed with a token github mints per run
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  dashboard:
    # inert until the publish role is deployed and its arn set as a repository variable
    if: vars.AWS_PUBLISH_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # the views are whatever the weekend pipeline last emitted. CI never fits anything
      - run: just web-data
      - run: just web-deploy
