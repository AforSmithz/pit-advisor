name: image

# the pipeline image is built here so a laptop never needs a docker daemon. it is tagged with
# the commit, and `just deploy-pipeline` pins the stacks to the newest one
on:
  push:
    branches: [main]
    # what the Dockerfile copies. keep in step with image_inputs in the justfile
    paths:
      - src/**
      - transform/**
      - data/reference/**
      - results/backtest/**
      - pyproject.toml
      - uv.lock
      - README.md
      - infra/docker/pipeline.Dockerfile
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# two pushes in a row both get an image, the second one simply lands after the first
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    # inert until the image role is deployed and its arn set as a repository variable
    if: vars.AWS_IMAGE_ROLE_ARN != ''
    # fargate and lambda both run arm64, and emulating it on x86 takes the better part of an hour
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      REPOSITORY: pitadvisor-pipeline-dev
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          aws-region: ap-southeast-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      # provenance off and docker media types on: buildx defaults to an oci index with an
      # attestation manifest, which fargate takes and lambda rejects as an unsupported media type
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/pipeline.Dockerfile
          platforms: linux/arm64
          provenance: false
          outputs: type=image,oci-mediatypes=false,push=true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the pipeline overrides the command exactly like this, and an entrypoint that swallows it
      # is a step that exits 0 having done nothing. PITADV_AWS_PROFILE is empty because the
      # container has no ~/.aws, so a named profile fails at the first api call
      - run: |
          docker run --rm -e PITADV_AWS_PROFILE="" \
            ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }} \
            sh -c "pitadv version && dbt --version > /dev/null \
              && python -c 'from pitadvisor.config import boto_session; boto_session().client(\"s3\")'"
