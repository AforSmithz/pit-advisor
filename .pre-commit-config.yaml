default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      # .gitignore already covers this, the hook is what catches a `git add -f`
      - id: readme-only-markdown
        name: only README.md is committed
        language: fail
        entry: markdown other than README.md never gets committed
        files: \.md$
        exclude: ^README\.md$
